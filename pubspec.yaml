name: school_admission_app
description: "School Admission Management Application — Technical Recruitment Assignment."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Firebase ──────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # ── State Management ──────────────────────────────────────
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # ── Dependency Injection ──────────────────────────────────
  get_it: ^8.0.3

  # ── Navigation ────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Functional Error Handling ─────────────────────────────
  dartz: ^0.10.1

  # ── Utilities ─────────────────────────────────────────────
  uuid: ^4.5.1
  intl: ^0.20.2

  # ── UI / Design ───────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ── BLoC Testing ──────────────────────────────────────────
  bloc_test: ^10.0.0

  # ── Mocking ───────────────────────────────────────────────
  mockito: ^5.4.5
  build_runner: ^2.4.15

  # ── Firebase Test Fakes ───────────────────────────────────
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1

flutter:
  uses-material-design: true
